name: OS Custom CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    name: Assemble boot and kernel objects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm binutils make
      - name: Assemble and validate
        run: make check
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: os-custom-build
          path: build/
          if-no-files-found: error
